# Build the Python distribution and publish it to PyPI.
#
# Publishing is GATED so a GitHub Release never fails before PyPI is set up:
#   * it runs only when the repository variable `PUBLISH_TO_PYPI` is "true",
#   * and can then be triggered either by a release or manually
#     ("Run workflow" → workflow_dispatch).
#
# One-time setup for trusted publishing (no API token needed):
#   1. PyPI → your project (or "Publishing" → add a pending project) →
#      add a trusted publisher with:
#        Owner: ngohoanhkhoa · Repository: regulatory_compliance
#        Workflow: python-publish.yml · Environment: pypi
#   2. GitHub → repo Settings → Environments → create an environment named `pypi`.
#   3. GitHub → repo Settings → Variables → Actions → new variable
#      `PUBLISH_TO_PYPI` = true.
#
# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    # Skipped until PyPI publishing is explicitly enabled.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # Mandatory for trusted publishing (OIDC).
      id-token: write

    # Must match the environment configured on the PyPI trusted publisher.
    environment:
      name: pypi
      # url: https://pypi.org/p/regulatory-compliance

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
