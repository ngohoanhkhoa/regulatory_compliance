server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API routes to the backend container
    location /auth/ { proxy_pass http://backend:8000; }
    location = /query { proxy_pass http://backend:8000; }
    location /acts/ { proxy_pass http://backend:8000; }
    location = /history { proxy_pass http://backend:8000; }
    location = /feedback { proxy_pass http://backend:8000; }
    location = /ingest { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }
    location = /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    # SPA fallback: serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pass headers for proxying
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The /query route loads BGE models + calls the LLM API — can take 2-3 min
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}