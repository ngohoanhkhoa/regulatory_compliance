server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /auth/ { proxy_pass http://backend:8000; }
    location /chat { proxy_pass http://backend:8000; }
    location /query { proxy_pass http://backend:8000; }
    location /acts/ { proxy_pass http://backend:8000; }
    location /history { proxy_pass http://backend:8000; }
    location /api/ { proxy_pass http://backend:8000; }
    location /feedback { proxy_pass http://backend:8000; }
    location /health { proxy_pass http://backend:8000; }
    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
