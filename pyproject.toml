[project]
name = "regulatory-compliance"
version = "0.1.0"
description = "Citable RAG chatbot for EU regulatory obligations (CEPS EurLex)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "The EU Regulatory Compliance RAG Chatbot contributors" }]
keywords = ["rag", "retrieval-augmented-generation", "legal-tech", "eurlex", "eu-law", "fastapi", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "polars>=1.9.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pyarrow>=17.0.0",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/<your-org>/regulatory_compliance"
Repository = "https://github.com/<your-org>/regulatory_compliance"
Issues = "https://github.com/<your-org>/regulatory_compliance/issues"
Changelog = "https://github.com/<your-org>/regulatory_compliance/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]